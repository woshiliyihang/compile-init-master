name: Build Jason AIDL HAL

on:
  workflow_dispatch:
    inputs:
      aosp_ref:
        description: 'AOSP branch/tag (example: android-11.0.0_r48)'
        required: true
        default: 'android-11.0.0_r48'
      lunch_target:
        description: 'Lunch target'
        required: true
        default: 'aosp_arm64-userdebug'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_DIR: ${{ github.workspace }}/aosp
      LUNCH_TARGET: ${{ inputs.lunch_target }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout HAL repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core repo bc bison build-essential curl flex g++-multilib \
            gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Init and sync AOSP
        run: |
          mkdir -p "$AOSP_DIR"
          cd "$AOSP_DIR"
          repo init -u https://android.googlesource.com/platform/manifest -b "${{ inputs.aosp_ref }}"
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Copy HAL sources into AOSP tree
        run: |
          mkdir -p "$AOSP_DIR/hardware/interfaces/jason"
          rsync -a --delete "$GITHUB_WORKSPACE/aidl/jason/" "$AOSP_DIR/hardware/interfaces/jason/"
          cp "$GITHUB_WORKSPACE/scripts/build_jason_hal.sh" "$AOSP_DIR/"

      - name: Build HAL module
        run: |
          cd "$AOSP_DIR"
          export LUNCH_TARGET
          export ARTIFACT_DIR
          ./build_jason_hal.sh

      - name: Upload HAL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jason-hal-${{ inputs.aosp_ref }}
          path: artifacts/
